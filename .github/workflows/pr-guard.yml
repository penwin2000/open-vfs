name: PR Guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "pr-guard-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  pr-guard:
    name: PR Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (read-only diff inspection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select trusted guard scripts and base ref
        id: guard_setup
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true || github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if git rev-parse --verify "origin/${BASE_REF}^{commit}" >/dev/null 2>&1; then
            DIFF_BASE="origin/${BASE_REF}"
          else
            DIFF_BASE="${BASE_SHA}"
          fi

          if [ "${IS_FORK}" = "true" ] && git cat-file -e "${DIFF_BASE}:tools/pr_guard.py" 2>/dev/null; then
            GUARD_SCRIPT="${RUNNER_TEMP}/pr_guard.py"
            git show "${DIFF_BASE}:tools/pr_guard.py" > "${GUARD_SCRIPT}"
            echo "Using trusted base-branch tools/pr_guard.py for external fork PR."
          else
            GUARD_SCRIPT="tools/pr_guard.py"
            echo "Using repository tools/pr_guard.py."
          fi

          PROGRESS_SCRIPT=""
          if [ "${IS_FORK}" = "true" ]; then
            if git cat-file -e "${DIFF_BASE}:tools/progress.py" 2>/dev/null; then
              PROGRESS_SCRIPT="${RUNNER_TEMP}/progress.py"
              git show "${DIFF_BASE}:tools/progress.py" > "${PROGRESS_SCRIPT}"
            fi
          elif [ -f "tools/progress.py" ]; then
            PROGRESS_SCRIPT="tools/progress.py"
          fi

          CLAIM_SCRIPT=""
          if [ "${IS_FORK}" = "true" ]; then
            if git cat-file -e "${DIFF_BASE}:tools/claim_guard.py" 2>/dev/null; then
              CLAIM_SCRIPT="${RUNNER_TEMP}/claim_guard.py"
              git show "${DIFF_BASE}:tools/claim_guard.py" > "${CLAIM_SCRIPT}"
            fi
          elif [ -f "tools/claim_guard.py" ]; then
            CLAIM_SCRIPT="tools/claim_guard.py"
          fi

          echo "diff_base=${DIFF_BASE}" >> "${GITHUB_OUTPUT}"
          echo "script=${GUARD_SCRIPT}" >> "${GITHUB_OUTPUT}"
          echo "progress_script=${PROGRESS_SCRIPT}" >> "${GITHUB_OUTPUT}"
          echo "claim_script=${CLAIM_SCRIPT}" >> "${GITHUB_OUTPUT}"

      - name: Verify automation self-tests
        shell: bash
        env:
          GUARD_SCRIPT: ${{ steps.guard_setup.outputs.script }}
          PROGRESS_SCRIPT: ${{ steps.guard_setup.outputs.progress_script }}
          CLAIM_SCRIPT: ${{ steps.guard_setup.outputs.claim_script }}
        run: |
          set -euo pipefail
          python3 "${GUARD_SCRIPT}" --self-test
          if [ -n "${PROGRESS_SCRIPT}" ] && python3 "${PROGRESS_SCRIPT}" --help | grep -q -- "--self-test"; then
            python3 "${PROGRESS_SCRIPT}" --self-test
          fi
          if [ -n "${CLAIM_SCRIPT}" ] && python3 "${CLAIM_SCRIPT}" --help | grep -q -- "--self-test"; then
            python3 "${CLAIM_SCRIPT}" --self-test
          fi

      - name: Snapshot open pull requests for overlap detection (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          OUT_PATH: ${{ runner.temp }}/open_prs.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_pr = int(os.environ.get("CURRENT_PR_NUMBER") or "0")
          out_path = os.environ["OUT_PATH"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "open-vfs-pr-guard",
          }

          def api_get(url: str):
              req = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8") or "[]")

          snapshot = []
          pulls = api_get(f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100")
          other_count = 0
          for pr in pulls:
              num = int(pr.get("number") or 0)
              if num <= 0 or num == current_pr:
                  continue
              files_summary = []
              if other_count < 50:
                  other_count += 1
                  try:
                      pr_files = api_get(
                          f"https://api.github.com/repos/{repo}/pulls/{num}/files?per_page=100"
                      )
                      for f in pr_files:
                          fname = str(f.get("filename") or "")
                          if fname.startswith("src/"):
                              files_summary.append(
                                  {"filename": fname, "patch": str(f.get("patch") or "")}
                              )
                  except urllib.error.HTTPError as exc:
                      print(f"Warning: could not fetch files for PR #{num}: HTTP {exc.code}")

              snapshot.append(
                  {
                      "number": num,
                      "title": str(pr.get("title") or ""),
                      "body": str(pr.get("body") or ""),
                      "headRefName": str((pr.get("head") or {}).get("ref") or ""),
                      "files": files_summary,
                  }
              )

          with open(out_path, "w", encoding="utf-8") as fh:
              json.dump(snapshot, fh)
          print(f"Snapshotted {len(snapshot)} other open PR(s) for overlap check.")
          PY

      - name: Inspect pull request diff
        shell: bash
        env:
          GUARD_SCRIPT: ${{ steps.guard_setup.outputs.script }}
          DIFF_BASE: ${{ steps.guard_setup.outputs.diff_base }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true || github.event.pull_request.head.repo.full_name != github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPEN_PRS_FILE: ${{ runner.temp }}/open_prs.json
          OPEN_VFS_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          args=(--base "${DIFF_BASE}" --head HEAD)
          if [ "${IS_FORK}" = "true" ]; then
            args+=(--is-fork)
          fi
          if python3 "${GUARD_SCRIPT}" --help | grep -q -- "--open-prs-json"; then
            args+=(--open-prs-json "${OPEN_PRS_FILE}" --pr-number "${PR_NUMBER}")
          fi
          python3 "${GUARD_SCRIPT}" "${args[@]}"
