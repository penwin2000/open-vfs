name: Build, Test & Progress Map

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-progress:
    name: Build open-vfs.exe, Run CTest & Render Tile Map
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake (C++20 / x64)
        shell: pwsh
        run: cmake -B build -A x64

      - name: Build open-vfs.exe & unit tests
        shell: pwsh
        run: cmake --build build --config Release -- /m:1 /nr:false

      - name: Run CTest synthetic-buffer test suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test open-vfs.exe CLI
        shell: pwsh
        run: |
          ./build/Release/open-vfs.exe --version
          if ($LASTEXITCODE -ne 0) { throw "open-vfs.exe --version failed" }

          $invalidDir = Join-Path $env:RUNNER_TEMP "smoke_invalid"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $invalidDir
          New-Item -ItemType Directory -Force -Path $invalidDir | Out-Null

          $prevErrPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          ./build/Release/open-vfs.exe --data-dir $invalidDir --headless
          $invalidExit = $LASTEXITCODE
          $ErrorActionPreference = $prevErrPref
          if ($invalidExit -eq 0) {
            throw "Expected non-zero exit code for incompatible data layout"
          }

          $validDir = Join-Path $env:RUNNER_TEMP "smoke_valid"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $validDir
          New-Item -ItemType Directory -Force -Path $validDir | Out-Null

          $rpf9 = New-Object byte[] 32
          [System.Text.Encoding]::ASCII.GetBytes("RPF9").CopyTo($rpf9, 0)
          for ($i = 0; $i -lt 22; $i++) {
            [System.IO.File]::WriteAllBytes((Join-Path $validDir ("pack_{0:D2}.rpf" -f $i)), $rpf9)
          }

          $rds5 = New-Object byte[] 32
          [System.Text.Encoding]::ASCII.GetBytes("RDS5").CopyTo($rds5, 0)
          for ($i = 0; $i -lt 57; $i++) {
            [System.IO.File]::WriteAllBytes((Join-Path $validDir ("stream_{0:D2}.ttpf" -f $i)), $rds5)
          }

          $xvd = New-Object byte[] 0x240
          [System.Text.Encoding]::ASCII.GetBytes("msft-xvd").CopyTo($xvd, 0x200)
          [System.IO.File]::WriteAllBytes((Join-Path $validDir "volume_00.xvd"), $xvd)

          $pri = New-Object byte[] 32
          [System.Text.Encoding]::ASCII.GetBytes("mrm_pri2").CopyTo($pri, 0)
          [System.IO.File]::WriteAllBytes((Join-Path $validDir "index_00.pri"), $pri)

          ./build/Release/open-vfs.exe --data-dir $validDir --headless
          if ($LASTEXITCODE -ne 0) { throw "open-vfs.exe --headless failed on valid synthetic layout" }

      - name: Upload Release open-vfs.exe artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: open-vfs-win64
          path: build/Release/open-vfs.exe
          if-no-files-found: error

      - name: Attach open-vfs.exe to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "build/Release/open-vfs.exe"
          $checksum = "build/Release/open-vfs.exe.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
          "$hash  open-vfs.exe" | Out-File -Encoding ascii -NoNewline $checksum

          $prevErrPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevErrPref

          if ($releaseExists) {
            gh release upload $tag $asset $checksum --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $asset $checksum `
              --repo "${{ github.repository }}" `
              --title "open-vfs $tag" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release asset for $tag" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan macros and regenerate progress.svg
        shell: pwsh
        run: |
          python tools/progress.py --scan | Out-File -Encoding utf8 progress.json
          python tools/progress.py --output progress.svg

      - name: Stage GitHub Pages site bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site | Out-Null
          Copy-Item progress.svg _site/progress.svg
          Copy-Item progress.json _site/progress.json
          Copy-Item assets/banner.svg _site/banner.svg
          @'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>open-vfs — Live Porting Progress</title>
            <style>
              :root { color-scheme: dark; }
              body {
                margin: 0;
                min-height: 100vh;
                background: #090d13;
                color: #e6edf3;
                font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 36px 20px;
                gap: 24px;
              }
              img { max-width: 960px; width: 100%; height: auto; }
              footer { color: #8b949e; font-size: 13px; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <img src="./banner.svg" alt="open-vfs hero banner" />
            <img src="./progress.svg" alt="open-vfs subsystem tile map" />
            <footer>
              Clean-room C++20 &amp; DirectX 12 Windows 11 runtime &bull;
              <a href="https://github.com/penwin2000/open-vfs">Repository</a> &bull;
              <a href="./progress.svg">Raw SVG</a> &bull;
              <a href="./progress.json">JSON Feed</a>
            </footer>
          </body>
          </html>
          '@ | Out-File -Encoding utf8 _site/index.html

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Publish progress.svg to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-progress
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
